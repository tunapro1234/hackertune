  <div class="mini-row">
    <a class="mini-thumb" id="miniThumb" href="#" data-link aria-label="Back to video"></a>
    <div class="mini-txt"><a id="miniTitle" href="#" data-link></a><span id="miniSub"></span></div>
    <button class="ib" id="miniBack" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-family="sans-serif" font-weight="700">15</text></svg></button>
