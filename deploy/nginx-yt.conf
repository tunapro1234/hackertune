# HackerTune nginx örneği. /api/chat (SSE) ve /api/audio (ses Range akışı) tamponsuz olmalı.
# server_name ve sertifika yollarını kendi alan adına göre değiştir.
limit_req_zone $binary_remote_addr zone=yt_chat:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=yt_api:10m rate=20r/s;

server {
    server_name yt.tunapro.xyz;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 4m;

    location = /api/chat {
        limit_req zone=yt_chat burst=6 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /api/audio/ {
        # arka plan sesi: googlevideo'dan Range parçaları, akış halinde (tamponsuz)
        limit_req zone=yt_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location /api/ {
        limit_req zone=yt_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        expires 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tunapro.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunapro.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name yt.tunapro.xyz;
    return 301 https://$host$request_uri;
}
