# HackerTune iOS app (ios/): build check + TestFlight upload, all on GitHub's macOS runners.
#
# simulator  every push touching ios/** (or this file) and every manual run: generates the
#            Xcode project with XcodeGen and builds for the iOS Simulator without signing.
# testflight manual runs (workflow_dispatch) and tags ios-v*: imports an Apple Distribution
#            certificate and an App Store provisioning profile from secrets into a temporary
#            keychain, archives with manual signing, exports the .ipa and uploads it with
#            `xcrun altool` using an App Store Connect API key. Xcode's cloud signing
#            (-exportArchive with -authenticationKey*) was dropped: on a fresh team it failed with
#            "Cannot verify client's JWT headers" even though the same key worked against the API.
#            Skips (green) when the secrets are missing.
#
# Secrets (see ios/README.md): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8),
# APPLE_TEAM_ID, DIST_CERT_P12 (base64 .p12 with the distribution cert + key),
# DIST_CERT_PASSWORD, PROFILE_B64 (base64 App Store .mobileprovision). Cert and profile can be
# made with the API key (Admin or App Manager); both expire after a year.
#
# Version: MARKETING_VERSION from ios/project.yml, build number = github.run_number.

name: ios

on:
  push:
    branches: ["**"]
    tags: ["ios-v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  simulator:
    name: Simulator build (unsigned)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project HackerTune.xcodeproj \
            -scheme HackerTune \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Show compiler warnings
        if: always()
        run: grep -E "warning:" "$RUNNER_TEMP/build.log" | sort -u || true

  testflight:
    name: Archive + upload to TestFlight
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      PROFILE_B64: ${{ secrets.PROFILE_B64 }}
    steps:
      - name: Check secrets
        id: creds
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ] \
             || [ -z "$DIST_CERT_P12" ] || [ -z "$DIST_CERT_PASSWORD" ] || [ -z "$PROFILE_B64" ]; then
            echo "::notice::Signing/App Store Connect secrets not set: skipping TestFlight upload (see ios/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'

      - name: Install XcodeGen
        if: steps.creds.outputs.ok == 'true'
        run: |
          xcodebuild -version
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        if: steps.creds.outputs.ok == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Write API key
        if: steps.creds.outputs.ok == 'true'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Check API key against App Store Connect
        if: steps.creds.outputs.ok == 'true'
        # Fails fast with a readable message when the key, key ID or issuer ID is wrong,
        # instead of xcodebuild's "No Accounts with App Store Connect Access".
        run: |
          python3 -m venv "$RUNNER_TEMP/jwtenv"
          "$RUNNER_TEMP/jwtenv/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/jwtenv/bin/python" - <<'PY'
          import json, os, time, urllib.error, urllib.request
          import jwt
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": now, "exp": now + 600,
                            "aud": "appstoreconnect-v1"}, open(os.environ["ASC_KEY_PATH"]).read(),
                           algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"].strip(), "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?fields[apps]=bundleId",
                                       headers={"Authorization": "Bearer " + tok})
          try:
              apps = [a["attributes"]["bundleId"] for a in json.load(urllib.request.urlopen(req, timeout=30))["data"]]
          except urllib.error.HTTPError as e:
              raise SystemExit(f"::error::App Store Connect rejected the API key: HTTP {e.code} {e.read().decode()[:300]}")
          print("API key OK; apps:", apps)
          if "xyz.tunapro.hackertune" not in apps:
              print("::warning::No App Store Connect app record for xyz.tunapro.hackertune yet (see ios/README.md).")
          PY

      - name: Install signing certificate and profile
        if: steps.creds.outputs.ok == 'true'
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "Profile: $NAME ($UUID)"

      - name: Archive (manual signing)
        if: steps.creds.outputs.ok == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HackerTune.xcodeproj \
            -scheme HackerTune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HackerTune.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN"

      - name: Export .ipa
        if: steps.creds.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>xyz.tunapro.hackertune</key><string>${PROFILE_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HackerTune.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        if: steps.creds.outputs.ok == 'true'
        run: |
          # altool finds the key as ~/.appstoreconnect/private_keys/AuthKey_<id>.p8
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::HackerTune build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 5-30 min)."

      - name: Clean up keys
        if: always() && steps.creds.outputs.ok == 'true'
        run: |
          rm -f "$ASC_KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          [ -n "$SIGNING_KEYCHAIN" ] && security delete-keychain "$SIGNING_KEYCHAIN" || true
