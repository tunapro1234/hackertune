# HackerTune iOS app (ios/): build check + TestFlight upload, all on GitHub's macOS runners.
#
# simulator  every push touching ios/** (or this file) and every manual run: generates the
#            Xcode project with XcodeGen and builds for the iOS Simulator without signing.
# testflight manual runs (workflow_dispatch) and tags ios-v*: archives the app UNSIGNED, then
#            `xcodebuild -exportArchive` signs it with Xcode's cloud-managed Apple Distribution
#            certificate and uploads it to App Store Connect (destination: upload), using an
#            App Store Connect API key. No certificates or profiles are created by hand.
#            Archiving unsigned matters: automatic signing at archive time makes Xcode mint a new
#            "Apple Development: Created via API" certificate on every fresh runner until the
#            team's certificate cap is hit. The app has no entitlements file, so nothing is lost.
#            Skips (green) when the secrets are missing.
#
# Secrets (see ios/README.md): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8),
# APPLE_TEAM_ID. The API key needs the Admin role: cloud signing has to be able to create the
# distribution certificate and the App Store provisioning profile.
#
# Version: MARKETING_VERSION from ios/project.yml, build number = github.run_number.

name: ios

on:
  push:
    branches: ["**"]
    tags: ["ios-v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODEGEN_VERSION: "2.46.0"

jobs:
  simulator:
    name: Simulator build (unsigned)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project HackerTune.xcodeproj \
            -scheme HackerTune \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"

      - name: Show compiler warnings
        if: always()
        run: grep -E "warning:" "$RUNNER_TEMP/build.log" | sort -u || true

  testflight:
    name: Archive + upload to TestFlight
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secrets
        id: creds
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID not set: skipping TestFlight upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'

      - name: Install XcodeGen
        if: steps.creds.outputs.ok == 'true'
        run: |
          xcodebuild -version
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        if: steps.creds.outputs.ok == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Write API key
        if: steps.creds.outputs.ok == 'true'
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (unsigned)
        if: steps.creds.outputs.ok == 'true'
        working-directory: ios
        # No -allowProvisioningUpdates / API key here on purpose: see the header.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project HackerTune.xcodeproj \
            -scheme HackerTune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HackerTune.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export (cloud signing) and upload to App Store Connect
        if: steps.creds.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HackerTune.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::HackerTune build ${{ github.run_number }} uploaded. It appears in TestFlight after Apple finishes processing (usually 5-30 min)."

      - name: Remove API key
        if: always() && steps.creds.outputs.ok == 'true'
        run: rm -f "$ASC_KEY_PATH"
