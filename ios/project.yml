# XcodeGen spec. CI runs `xcodegen generate` in ios/; no .xcodeproj is committed.
name: HackerTune
options:
  bundleIdPrefix: xyz.tunapro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  HackerTune:
    type: application
    platform: iOS
    sources:
      - path: HackerTune
    settings:
      base:
        PRODUCT_NAME: HackerTune
        PRODUCT_BUNDLE_IDENTIFIER: xyz.tunapro.hackertune
        INFOPLIST_FILE: HackerTune/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM is passed on the xcodebuild command line in CI (secret APPLE_TEAM_ID).
